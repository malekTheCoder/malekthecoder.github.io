<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/css/style.css?v=77" /></head><body>
<style>
  body{margin:0;padding:40px 20px;background:var(--bg);font-family:'IBM Plex Sans',system-ui,sans-serif}
  .lab{max-width:1000px;margin:0 auto}
  .row{border:1px dashed var(--border);border-radius:8px;padding:44px 20px 40px;margin-bottom:26px;position:relative;display:flex;justify-content:center}
  .tag{position:absolute;top:10px;left:14px;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-2);letter-spacing:.08em}

  /* B: one pill */
  .cueB{display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1.15rem;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);
        font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text-1);text-decoration:none;cursor:pointer}
  .cueB:hover{color:var(--accent);border-color:var(--accent)}
  .cueB svg{animation:nudge 2.4s ease-in-out infinite}

  /* C: bigger label, chevron only */
  .cueC{display:flex;flex-direction:column;align-items:center;gap:.75rem;text-decoration:none;color:var(--text-0);cursor:pointer}
  .cueC .l{font-family:'JetBrains Mono',monospace;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}
  .cueC svg{color:var(--accent);animation:nudge 2.4s ease-in-out infinite}
  .cueC:hover .l{color:var(--accent)}

  /* D: line that draws down */
  .cueD{display:flex;flex-direction:column;align-items:center;gap:.9rem;text-decoration:none;color:var(--text-1);cursor:pointer}
  .cueD .l{font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}
  .cueD .rail{width:1px;height:46px;background:linear-gradient(var(--border),var(--border));position:relative;overflow:hidden}
  .cueD .rail::after{content:'';position:absolute;left:0;top:0;width:1px;height:18px;background:var(--accent);animation:drain 2.2s ease-in-out infinite}
  .cueD:hover .l{color:var(--accent)}

  /* E: three words stacked, no chrome */
  .cueE{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-decoration:none;cursor:pointer}
  .cueE .w{font-family:'JetBrains Mono',monospace;font-size:.9rem;letter-spacing:.06em;color:var(--text-0)}
  .cueE .w+.w{color:var(--text-1)}
  .cueE .w+.w+.w{color:var(--text-2)}
  .cueE svg{margin-top:.5rem;color:var(--accent);animation:nudge 2.4s ease-in-out infinite}

  @keyframes nudge{0%,62%,100%{transform:translateY(0)}76%{transform:translateY(5px)}}
  @keyframes drain{0%{transform:translateY(-20px)}60%,100%{transform:translateY(48px)}}
</style>

<div class="lab">

  <div class="row"><span class="tag">A &mdash; current</span>
    <a href="#" class="scroll-indicator" style="margin:0;padding:0">
      <span class="scroll-indicator-label">Experience &middot; Projects &middot; Education</span>
      <span class="scroll-indicator-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 5v14M5 12l7 7 7-7"/></svg></span>
    </a>
  </div>

  <div class="row"><span class="tag">B &mdash; single pill</span>
    <a href="#" class="cueB">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M6 9l6 6 6-6"/></svg>
      Experience &middot; Projects &middot; Education
    </a>
  </div>

  <div class="row"><span class="tag">C &mdash; bigger label, chevron only</span>
    <a href="#" class="cueC">
      <span class="l">Experience &middot; Projects &middot; Education</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M6 9l6 6 6-6"/></svg>
    </a>
  </div>

  <div class="row"><span class="tag">D &mdash; label over a draining rail</span>
    <a href="#" class="cueD">
      <span class="l">Experience &middot; Projects &middot; Education</span>
      <span class="rail"></span>
    </a>
  </div>

  <div class="row"><span class="tag">E &mdash; stacked words</span>
    <a href="#" class="cueE">
      <span class="w">Experience</span><span class="w">Projects</span><span class="w">Education</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M6 9l6 6 6-6"/></svg>
    </a>
  </div>

</div>
</body></html>
