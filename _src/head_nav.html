  <!-- Prevent flash of wrong theme on load -->
  <script>
    (function(){
      var DARK = new Set(['dark','vscode','darcula','tokyo','dracula','nord','github-dark','atom-one-dark']);
      var VALID = new Set(['light','dark','system','vscode','darcula','tokyo','dracula','nord','github-dark','atom-one-dark','xcode']);
      var t = localStorage.getItem('theme') || 'light';
      if (!VALID.has(t)) { t = 'light'; localStorage.setItem('theme', t); }
      if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
      var dark = DARK.has(t) || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('is-dark');
    })();
  </script>
